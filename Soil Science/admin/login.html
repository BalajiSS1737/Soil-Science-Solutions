<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Core Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #F5F7FA; color: #333333; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #FFFFFF; border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; overflow: hidden; }
        .card-header-accent { background-color: #2E7D32; color: #FFFFFF; padding: 25px; text-align: center; }
        .btn-auth { background-color: #4CAF50; color: #FFFFFF; border: none; font-weight: 600; padding: 12px; transition: background 0.2s; }
        .btn-auth:hover { background-color: #43A047; color: #FFFFFF; }
        .form-control:focus { border-color: #2E7D32; box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25); }
    </style>
    <form action="" method="GET">

<form action="../api/login.php" method="POST" id="adminLoginForm">
</head>
<body>
<div class="login-card">
    <div class="card-header-accent">
        <h3 class="fw-bold m-0"><i class="bi bi-shield-lock me-2"></i>Admin Core</h3>
        <small class="text-white-50 text-uppercase tracking-wider">Ecosystem Central Auditing Terminal</small>
    </div>
    <div class="card-body p-4">
        <div id="processingAlert" class="alert alert-danger d-none py-2 text-sm" role="alert"></div>
        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Terminal Identifier</label>
                <input type="text" name="username" class="form-control" placeholder="Enter root identifier..." required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Security Keyphrase</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-auth w-100 rounded-3"><i class="bi bi-cpu-fill me-2"></i> Initialize Security Handshake</button>
        </form>
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const response = await fetch(`../api/get_profile.php?t=${Date.now()}`);
        const data = await response.json();
        
        if (data.status === "success" && data.profile) {
            // Populate form input boxes
            document.getElementById("txtFullName").value = data.profile.full_name || '';
            document.getElementById("txtPhone").value = data.profile.phone || '';
            
            // NEW: Dynamically change page headers based on the database account role
            const accountBadge = document.getElementById("accountRoleHeader");
            if (accountBadge) {
                // Capitalizes the first letter (e.g., 'farmer' -> 'Farmer Dashboard Control')
                const formattedRole = data.profile.role.charAt(0).toUpperCase() + data.profile.role.slice(1);
                accountBadge.textContent = `${formattedRole} Account Configuration`;
            }
        }
    } catch (err) {
        console.error("Failed to map dynamic profile data elements.", err);
    }
});
</script>
</body>
</html>
