<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Analysis - Soil Science</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

<div id="wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h4 class="mb-0 text-success fw-bold"><i class="bi bi-tree-fill me-2"></i>Soil Science</h4>
        </div>
        <ul class="list-unstyled components">
            <li><a href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
            <li class="active"><a href="soil-analysis.html"><i class="bi bi-moisture me-2"></i> Soil Analysis</a></li>
            <li><a href="crop-recommendation.html"><i class="bi bi-journal-check me-2"></i> Crop Engine</a></li>
            <li><a href="dealers.html"><i class="bi bi-shop me-2"></i> Locate Dealers</a></li>
            <li><a href="feedback.html"><i class="bi bi-chat-dots me-2"></i> Feedback</a></li>
            <li><a href="settings.html"><i class="bi bi-gear me-2"></i> System Settings</a></li>
            <li><a href="../api/logout.php" class="text-danger"><i class="bi bi-box-arrow-left me-2"></i> Sign Out</a></li>
        </ul>
    </nav>

    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 rounded shadow-sm mb-4">
            <div class="container-fluid p-0">
                <button type="button" id="sidebarCollapse" class="btn btn-success-custom"><i class="bi bi-list"></i></button>
                <h4 class="mb-0 ms-3 fw-bold text-dark">Soil Chemistry Laboratory</h4>
            </div>
        </nav>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <h5 class="fw-bold mb-3 text-success"><i class="bi bi-plus-circle me-2"></i>New Core Sample</h5>
                    <form id="soilAnalysisForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Soil Type</label>
                            <select name="soil_type" class="form-select" required>
                                <option value="1">Alluvial</option><option value="2">Black Soil</option>
                                <option value="3">Red/Yellow Soil</option><option value="4">Laterite</option>
                                <option value="5">Arid/Desert</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Soil pH Balance</label>
                            <input type="number" step="0.1" name="ph" class="form-control" placeholder="e.g. 6.5" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Moisture Content (%)</label>
                            <input type="number" step="0.1" name="moisture" class="form-control" placeholder="e.g. 22.5" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Temperature (°C)</label>
                            <input type="number" step="0.1" name="temperature" class="form-control" placeholder="e.g. 26.0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Rainfall (mm)</label>
                            <input type="number" name="rainfall" class="form-control" placeholder="e.g. 1000" required>
                        </div>
                        <button type="submit" class="btn btn-success-custom w-100 py-2"><i class="bi bi-calculator me-2"></i>Process Prediction</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4 bg-white h-100">
                    <h5 class="fw-bold mb-3 text-dark"><i class="bi bi-clock-history me-2"></i>Historical Soil Logs</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Sample ID</th>
                                    <th>Soil Profile</th>
                                    <th>pH</th>
                                    <th>Moisture</th>
                                    <th>Prediction</th>
                                </tr>
                            </thead>
                            <tbody id="soilHistoryTable">
                                <tr><td colspan="5" class="text-center text-muted py-4">Syncing telemetry data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const soilMap = { 1: "Alluvial", 2: "Black", 3: "Red/Yellow", 4: "Laterite", 5: "Arid" };

    // Sidebar Toggle
    document.getElementById('sidebarCollapse').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('active');
    });

    // Form submission logic
    document.getElementById('soilAnalysisForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch("../api/add_soil_record.php", { method: "POST", body: new FormData(e.target) });
        const data = await res.json();
        if(data.status === 'success') {
            alert("Prediction Successful: " + data.crop);
            loadHistory();
        } else {
            alert("Error: " + data.message);
        }
    });

    // Load History
    async function loadHistory() {
        const res = await fetch(`../api/get_farmer_soil_logs.php?t=${Date.now()}`);
        const data = await res.json();
        const tbody = document.getElementById('soilHistoryTable');
        if(data.status === 'success') {
            tbody.innerHTML = data.logs.map(log => `
                <tr>
                    <td><code>#SL-${log.id}</code></td>
                    <td><span class="badge bg-dark">${soilMap[log.soil_type] || log.soil_type}</span></td>
                    <td>${parseFloat(log.ph_level).toFixed(1)}</td>
                    <td>${parseFloat(log.moisture_level).toFixed(1)}%</td>
                    <td><span class="badge bg-success">${log.crop_recommendation}</span></td>
                </tr>
            `).join('');
        }
    }
    document.addEventListener('DOMContentLoaded', loadHistory);
</script>
</body>
</html>
