<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration - Soil Science</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="card auth-card p-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-success">Create Farmer Account</h2>
                    <p class="text-muted text-xs">Join our predictive agricultural platform</p>
                </div>
                
                <div id="alertBox" class="alert d-none" role="alert"></div>

                <form id="registerForm">
                    <input type="hidden" name="role" value="farmer">
                    
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-gradient form-control" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success-custom w-100 py-2 mt-2">Register</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="small text-muted">Already have an account? <a href="login.html" class="text-success text-decoration-none fw-bold">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/auth.js"></script>
</body>
</html>
