<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard - Soil Science</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

<div id="wrapper">
    <nav id="sidebar">
        <div class="sidebar-header">
            <h4 class="mb-0 text-success fw-bold"><i class="bi bi-tree-fill me-2"></i>Soil Science</h4>
        </div>
        <ul class="list-unstyled components">
            <li class="active"><a href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
            <li><a href="soil-analysis.html"><i class="bi bi-moisture me-2"></i> Soil Analysis</a></li>
            <li><a href="crop-recommendation.html"><i class="bi bi-journal-check me-2"></i> Crop Engine</a></li>
            <li><a href="dealers.html"><i class="bi bi-shop me-2"></i> Locate Dealers</a></li>
            <li><a href="feedback.html"><i class="bi bi-chat-dots me-2"></i> Feedback</a></li>
            <li><a href="settings.html"><i class="bi bi-gear me-2"></i> System Settings</a></li>
            <li><a href="../api/logout.php" class="text-danger"><i class="bi bi-box-arrow-left me-2"></i> Sign Out</a></li>
        </ul>
    </nav>

    <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 rounded shadow-sm mb-4">
            <div class="container-fluid p-0">
                <button type="button" id="sidebarCollapse" class="btn btn-success-custom"><i class="bi bi-list"></i></button>
                <h4 class="mb-0 ms-3 fw-bold text-dark">Farmer Operational Deck</h4>
            </div>
        </nav>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <h6 class="text-muted small">Total Analyses</h6>
                    <h3 class="fw-bold text-success" id="totalSamples">0</h3>
                </div>
            </div>
            
            <div class="col-12">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-clock-history me-2"></i>Recent Telemetry Logs</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Sample ID</th>
                                    <th>Soil Type</th>
                                    <th>pH Level</th>
                                    <th>Moisture</th>
                                    <th>Crop Prediction</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="farmerHistoryTableBody">
                                <tr><td colspan="6" class="text-center py-4 text-muted">Syncing data stream...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Sidebar Toggle
    document.getElementById('sidebarCollapse').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('active');
    });

    // Fetch and Sync Logs
    const soilMap = { 1: "Alluvial", 2: "Black", 3: "Red/Yellow", 4: "Laterite", 5: "Arid" };

    async function syncDashboard() {
        try {
            const res = await fetch(`../api/get_farmer_soil_logs.php?t=${Date.now()}`);
            const data = await res.json();
            const tbody = document.getElementById('farmerHistoryTableBody');
            
            if (data.status === 'success') {
                document.getElementById('totalSamples').innerText = data.count || 0;
                tbody.innerHTML = data.logs.length > 0 ? data.logs.map(log => `
                    <tr>
                        <td><code>#SL-${log.id}</code></td>
                        <td><span class="badge bg-dark">${soilMap[log.soil_type] || 'N/A'}</span></td>
                        <td>${parseFloat(log.ph_level).toFixed(1)}</td>
                        <td>${parseFloat(log.moisture_level).toFixed(1)}%</td>
                        <td><span class="badge bg-success">${log.crop_recommendation}</span></td>
                        <td class="text-muted small">${new Date(log.analysis_date).toLocaleDateString()}</td>
                    </tr>
                `).join('') : '<tr><td colspan="6" class="text-center py-4 text-muted">No records found.</td></tr>';
            }
        } catch (err) {
            console.error("Sync Error:", err);
        }
    }
    document.addEventListener('DOMContentLoaded', syncDashboard);
</script>
</body>
</html>
